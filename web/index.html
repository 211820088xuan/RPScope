<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPScope · 关联方穿透底稿</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7; --surface:#fff; --ink:#18181b; --ink2:#52525b; --ink3:#71717a;
  --line:#e4e4e7; --line2:#f0f0f0;
  --accent:#2563eb; --high:#16a34a; --med:#ca8a04; --low:#71717a; --matched:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;font-size:13px;line-height:1.5}
.mono{font-family:'JetBrains Mono',Consolas,monospace}

/* top bar — flat, dense, terminal-like */
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);font-weight:500}
.top .name{font-size:14px;font-weight:600}
.top .spacer{flex:1}
.top .badge{font-size:10px;color:var(--ink3);font-family:'JetBrains Mono',monospace}

/* control — inline, no chips */
.ctl{display:flex;gap:6px;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.ctl input{padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:0}
.ctl input:focus{outline:none;border-color:var(--accent)}
.ctl button{padding:5px 12px;font-size:12px;cursor:pointer;background:var(--ink);color:#fff;border:none;border-radius:0}
.ctl button:hover{background:var(--accent)}
.ctl .ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.ctl .ghost:hover{background:var(--line2);color:var(--ink)}
.ctl .stat{margin-left:auto;font-size:11px;color:var(--ink2);font-family:'JetBrains Mono',monospace}
.ctl .stat b{color:var(--ink)}

/* main — two col, dense */
.main{display:grid;grid-template-columns:1.6fr 1fr}
.col{padding:16px 20px}
.col-l{border-right:1px solid var(--line)}
.col-r{position:sticky;top:0;align-self:start}

/* sections — divide-y, no cards */
.sec{padding:10px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.h2{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;letter-spacing:.3px}
.empty{color:var(--ink3);font-size:12px;font-style:italic}

/* table — dense, 1px rules, mono numbers */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line2)}
th{font-weight:500;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
td.r,th.r{text-align:right;font-family:'JetBrains Mono',monospace}
.dim{color:var(--ink3)}

/* three-class — inline text, no cards/big numbers */
.threecls{font-size:12px;color:var(--ink2);font-family:'JetBrains Mono',monospace;margin-bottom:8px;padding:4px 0}
.threecls .m{color:var(--matched)} .threecls .s{color:var(--accent)} .threecls .g{color:var(--low)}

/* related — divide-y list, no card backgrounds, confidence inline */
.rp-list{}
.rp-item{padding:5px 0;border-bottom:1px solid var(--line2);font-size:12px}
.rp-item:last-child{border-bottom:none}
.rp-item .nm{font-weight:500}
.rp-item .meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);margin-left:6px}
.rp-item .pth{font-size:10px;color:var(--ink3);margin-top:2px;font-family:'JetBrains Mono',monospace}
.rp-item .conf-high{color:var(--high)} .rp-item .conf-medium{color:var(--med)} .rp-item .conf-low{color:var(--low)}

/* events — timeline layout (different family from rp-list) */
.ev-list{}
.ev-item{display:grid;grid-template-columns:80px 70px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid var(--line2);font-size:11px}
.ev-item:last-child{border-bottom:none}
.ev-item .dt{font-family:'JetBrains Mono',monospace;color:var(--ink3)}
.ev-item .typ{font-family:'JetBrains Mono',monospace;color:var(--accent)}
.ev-item .sm{color:var(--ink2)}

/* disclaimer */
.disc{font-size:11px;color:var(--ink3);padding:8px 0;line-height:1.6}

/* graph */
#net{height:380px;border:1px solid var(--line);background:var(--surface);border-radius:0}
.gtitle{font-size:12px;font-weight:600;margin-bottom:6px}
.legend{display:flex;gap:10px;font-size:10px;color:var(--ink3);margin-top:6px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:3px}
.legend i{width:8px;height:8px;border-radius:0;display:inline-block}

/* Q&A — minimal inline */
.qa{margin:0 20px 16px;border:1px solid var(--line);background:var(--surface);border-radius:0}
.qa-h{padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.qa-h .hint{font-weight:400;font-size:10px;color:var(--ink3)}
.qa-b{padding:10px 12px}
.qa-row{display:flex;gap:6px;margin-bottom:6px}
.qa-row input{flex:1;padding:5px 8px;font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:0;font-family:'Noto Sans SC',sans-serif}
.qa-row input:focus{outline:none;border-color:var(--accent)}
.qa-out{font-size:12px;white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:0;min-height:32px;border:1px solid var(--line2);font-family:'Noto Sans SC',sans-serif}
.qa-out .tg{font-size:10px;color:var(--ink3);margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.err{color:var(--accent);font-size:12px}

@media(max-width:780px){.main{grid-template-columns:1fr}.col-l{border-right:none;border-bottom:1px solid var(--line)}.col-r{position:static}}
</style>
</head>
<body>

<div class="top">
  <span class="code" id="tcode">------</span>
  <span class="name" id="tname">关联方穿透底稿</span>
  <span class="spacer"></span>
  <span class="badge">判定 LLM=0 / 回查防幻觉 / 非投资建议</span>
</div>

<div class="ctl">
  <input id="code" type="text" value="002594" style="width:80px">
  <button onclick="load()">生成</button>
  <button class="ghost" onclick="load('002594')">比亚迪</button>
  <button class="ghost" onclick="load('300750')">宁德时代</button>
  <span class="stat" id="stat"></span>
</div>

<div class="main">
  <div class="col col-l" id="report"><p class="empty">输入代码点生成。</p></div>
  <div class="col col-r">
    <div class="gtitle">股权与关联路径</div>
    <div id="net"></div>
    <div class="legend">
      <span><i style="background:#e08a2b"></i>主体</span>
      <span><i style="background:var(--accent)"></i>实控人</span>
      <span><i style="background:#888"></i>股东</span>
      <span><i style="background:var(--high)"></i>high</span>
      <span><i style="background:var(--med)"></i>med</span>
      <span><i style="background:var(--matched)"></i>验证</span>
    </div>
  </div>
</div>

<div class="qa">
  <div class="qa-h">问答<span class="hint">意图路由 / 简单题不调 LLM / 回查防幻觉</span></div>
  <div class="qa-b">
    <div class="qa-row">
      <input id="q" type="text" value="002594的前十大股东和实控人" placeholder="002594的关联方 / 002594和300750什么关系 / 002594风险事件">
      <button onclick="ask()">问</button>
    </div>
    <div class="qa-out" id="ans"><span class="dim">点问看答案。</span></div>
  </div>
</div>

<script>
function dv(v,d='—'){return(v===null||v===undefined||v===''||v==='None')?d:v}
async function load(force){
  const code=(force||document.getElementById('code').value).trim();
  document.getElementById('code').value=code;
  document.getElementById('tcode').textContent=code;
  document.getElementById('tname').textContent='加载中';
  document.getElementById('stat').textContent='';
  document.getElementById('report').innerHTML='<p class=empty>加载中</p>';
  let r;
  try{r=await fetch('/api/report/'+code).then(async x=>x.ok?x.json():Promise.reject(await x.text()))}
  catch(e){document.getElementById('report').innerHTML='<p class=err>'+String(e).slice(0,180)+'</p>';return}
  if(!r||r.error){document.getElementById('report').innerHTML='<p class=err>'+(r&&r.error||'无数据')+'</p>';return}
  const co=r.basic||{};
  document.getElementById('tname').textContent=(co.short_name||'')+' 关联方穿透底稿';
  const rr=r.related||{};
  document.getElementById('stat').innerHTML=`已披露 <b>${rr.n_matched}</b> / 系统发现 <b>${rr.n_system_only}</b> / 年报未验证 <b>${rr.n_gold_only}</b> / 事件 ${r.events.length}`;
  renderReport(code,r);drawNet(code,r);
}
function renderReport(code,r){
  const co=r.basic||{};
  let h='';
  // 基本信息 — dense table
  h+='<div class=sec><div class=h2>基本信息</div><table>'+
     `<tr><td class=dim style=width:50px>简称</td><td>${co.short_name||dv(co.short_name)}</td><td class=dim style=width:50px>代码</td><td class=mono>${code}</td></tr>`+
     `<tr><td class=dim>行业</td><td>${co.industry||'未知'}</td><td class=dim>上市</td><td class=mono>${dv(co.list_date)}</td></tr></table></div>`;
  // 股权结构 — table (layout family 1)
  h+='<div class=sec><div class=h2>股权结构 前十大股东</div><table><thead><tr><th class=r>#</th><th>股东</th><th class=r>比例</th><th>类型</th></tr></thead><tbody>';
  (r.holders||[]).forEach((x,i)=>{h+=`<tr><td class=r>${dv(x.holder_rank,i+1)}</td><td>${x.display_name}</td><td class=r>${x.ratio!=null?x.ratio+'%':'<span class=dim>未披露</span>'}</td><td class="dim mono">${dv(x.entity_type)}</td></tr>`});
  if(!(r.holders||[]).length)h+='<tr><td colspan=4 class=empty>无</td></tr>';
  h+='</tbody></table>';
  const cs=r.controllers||[];
  h+=`<div style="margin-top:4px;font-size:12px"><span class=dim>实控人</span> ${cs.length?cs.map(x=>x.display_name+' ('+dv(x.control_ratio)+'%)').join(' '):'<span class=dim>未披露</span>'}</div></div>`;
  // 关联方清单 — inline three-class + divide-y list (layout family 2)
  const rr=r.related||{};
  h+='<div class=sec><div class=h2>关联方清单</div>';
  h+=`<div class=threecls>已披露验证 <span class=m>${rr.n_matched}</span> / 系统发现待核查 <span class=s>${rr.n_system_only}</span> / 年报未验证 <span class=g>${rr.n_gold_only}</span></div>`;
  h+='<div class=rp-list>';
  (rr.system_only||[]).slice(0,18).forEach(s=>{
    const cf=s.confidence;
    h+=`<div class=rp-item><span class=nm>${s.name}</span><span class="meta conf-${cf}">${cf}</span><span class=meta>${s.rule}</span>${s.path?`<div class=pth>${s.path}</div>`:''}</div>`;
  });
  h+='</div>';
  h+=`<div style="margin-top:4px;font-size:11px"><span class=dim>已披露验证</span> ${(rr.matched||[]).map(x=>x.name).join(' ')||'<span class=dim>无</span>'}</div>`;
  h+=`<div style="font-size:11px"><span class=dim>年报未验证</span> ${(rr.gold_only||[]).map(x=>x.name).join(' ')||'<span class=dim>无</span>'}</div></div>`;
  // 风险事件 — timeline grid (layout family 3, different from rp-list)
  h+='<div class=sec><div class=h2>风险事件时间线</div><div class=ev-list>';
  (r.events||[]).slice(0,12).forEach(e=>{h+=`<div class=ev-item><span class=dt>${dv(e.event_date)}</span><span class=typ>${e.event_type}</span><span class=sm>${(e.summary||'').slice(0,50)}</span></div>`});
  if(!(r.events||[]).length)h+='<span class=empty>无</span>';
  h+='</div></div>';
  // 口径
  h+=`<div class=sec><div class=h2>口径与限制</div><div class=disc>${r.disclaimer.disclaimer}<br><span class=dim>数据来源 ${r.disclaimer.data_sources}。覆盖 ${r.disclaimer.coverage}。</span></div></div>`;
  document.getElementById('report').innerHTML=h;
}
function drawNet(code,r){
  const nodes=[],edges=[];let i=0;
  nodes.push({id:code,label:code,color:'#e08a2b',shape:'box',font:{color:'#fff',size:13}});
  (r.controllers||[]).forEach(c=>{const id='c'+i++;nodes.push({id,label:c.display_name,color:'#2563eb',font:{color:'#fff',size:10}});edges.push({from:id,to:code,label:dv(c.control_ratio)+'%',arrows:'to',color:'#2563eb',font:{size:8}})});
  (r.holders||[]).slice(0,8).forEach(x=>{if((r.controllers||[]).some(c=>c.display_name===x.display_name))return;const id='h'+i++;nodes.push({id,label:x.display_name,color:'#888',font:{color:'#fff',size:9}});edges.push({from:id,to:code,label:x.ratio!=null?x.ratio+'%':'',arrows:'to',color:'#ccc',font:{size:8}})});
  (r.related.system_only||[]).slice(0,12).forEach(s=>{const id='p'+i++;const col=s.confidence==='high'?'#16a34a':(s.confidence==='medium'?'#ca8a04':'#71717a');nodes.push({id,label:s.name,color:col,font:{color:'#fff',size:9}});edges.push({from:code,to:id,label:s.rule,arrows:'to',dashes:s.confidence==='low',color:'#ccc',font:{size:8}})});
  (r.related.matched||[]).forEach(s=>{const id='m'+i++;nodes.push({id,label:s.name,color:'#1d4ed8',font:{color:'#fff',size:9}});edges.push({from:code,to:id,label:'gold',arrows:'to',color:'#1d4ed8',font:{size:8}})});
  new vis.Network(document.getElementById('net'),{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},{layout:{improvedLayout:true},physics:{stabilization:true},nodes:{shape:'dot',size:12},edges:{smooth:{type:'continuous'}}});
}
async function ask(){
  const q=document.getElementById('q').value.trim();if(!q)return;
  const out=document.getElementById('ans');out.innerHTML='<span class=dim>思考中</span>';
  let r;
  try{r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})}).then(async x=>x.ok?x.json():Promise.reject(await x.text()))}
  catch(e){out.innerHTML='<span class=err>'+String(e).slice(0,250)+'</span>';return}
  const v=r.verify||{};
  out.innerHTML='<div class=tg>'+r.intent+' / LLM '+(r.used_llm?'用':'未用')+' / 回查 '+(v.passed?'通过':'未通过')+(r.elapsed_ms!=null?' / '+Math.round(r.elapsed_ms)+'ms':'')+(r.cache_hit?' / 缓存':'')+'</div>'+r.answer;
}
</script>
</body>
</html>
