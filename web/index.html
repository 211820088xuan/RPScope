<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPScope · 关联方穿透底稿</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef2f6; --surface:#ffffff;
  --ink:#1e293b; --ink2:#64748b; --ink3:#94a3b8;
  --line:#cbd5e1; --line2:#e2e8f0;
  --accent:#0f766e; --accent-soft:#ccfbf1;
  --high:#15803d; --med:#b45309; --low:#6b7280; --matched:#1e40af;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 4px 12px rgba(15,23,42,.08),0 2px 4px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.serif{font-family:'Noto Serif SC',serif}
.mono{font-family:'JetBrains Mono',Consolas,monospace}

/* document header */
.doc-head{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 32px 16px}
.doc-head .row1{display:flex;align-items:baseline;gap:10px}
.doc-head .code{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);font-weight:500}
.doc-head h1{font-family:'Noto Serif SC',serif;font-weight:700;font-size:20px;letter-spacing:-.3px}
.doc-head .meta{margin-left:auto;font-size:11px;color:var(--ink3);text-align:right;line-height:1.5}
.doc-head .sub{font-size:12px;color:var(--ink2);margin-top:3px}

/* control bar */
.ctl{display:flex;align-items:center;gap:8px;padding:10px 32px;border-bottom:1px solid var(--line);background:var(--surface)}
.ctl input{padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:6px;color:var(--ink)}
.ctl input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ctl button{padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--ink);color:#fff;border:none;border-radius:6px;transition:background .15s}
.ctl button:hover{background:var(--accent)}
.ctl .ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.ctl .ghost:hover{background:var(--line2);color:var(--ink);border-color:var(--ink3)}
.ctl .stat{margin-left:auto;font-size:12px;color:var(--ink2);font-family:'JetBrains Mono',monospace}
.ctl .stat b{color:var(--ink);font-weight:500}

/* layout */
.main{display:grid;grid-template-columns:1.5fr 1fr;gap:0}
.col{padding:20px 32px}
.col-l{border-right:1px solid var(--line)}
.col-r{position:sticky;top:0;align-self:start}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-h{font-family:'Noto Serif SC',serif;font-weight:600;font-size:15px;margin-bottom:10px;color:var(--ink);display:flex;align-items:center;gap:6px}
.sec-h .badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;color:var(--ink3);margin-left:auto}
.empty{color:var(--ink3);font-size:12.5px;font-style:italic}

/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:5px 8px}
th{font-weight:500;color:var(--ink2);font-size:11px;border-bottom:1.5px solid var(--line)}
td{border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right;font-family:'JetBrains Mono',monospace}
.dim{color:var(--ink3)}

/* three-class summary — inline, color-coded, no big numbers */
.cls{display:flex;gap:16px;font-size:12px;padding:8px 0 10px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.cls .c{display:flex;align-items:baseline;gap:4px}
.cls .n{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:14px}
.cls .lbl{color:var(--ink2);font-size:11px}
.cls .m .n{color:var(--matched)} .cls .s .n{color:var(--accent)} .cls .g .n{color:var(--low)}

/* related list */
.rp-list{}
.rp-item{padding:7px 0;border-bottom:1px solid var(--line2)}
.rp-item:last-child{border-bottom:none}
.rp-item .nm{font-weight:500;font-size:13px}
.rp-item .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:6px;font-weight:400}
.rp-item .tag.high{background:#dcfce7;color:var(--high)}
.rp-item .tag.medium{background:#fef3c7;color:var(--med)}
.rp-item .tag.low{background:#f3f4f6;color:var(--low)}
.rp-item .rl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);margin-left:6px}
.rp-item .pth{font-size:11px;color:var(--ink3);margin-top:3px;font-family:'JetBrains Mono',monospace;line-height:1.4}
.rp-item .ev-detail{font-size:11px;color:var(--ink3);margin-top:3px;display:none;font-family:'JetBrains Mono',monospace}
.rp-item .ev-detail.show{display:block}
.rp-item:hover{cursor:pointer;background:var(--line2)}
.rp-inline{margin-top:6px;font-size:12px;color:var(--ink2);line-height:1.7}

/* events timeline */
.ev-list{}
.ev-item{display:grid;grid-template-columns:90px 75px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:12px}
.ev-item:last-child{border-bottom:none}
.ev-item .dt{font-family:'JetBrains Mono',monospace;color:var(--ink3);font-size:11px}
.ev-item .typ{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:11px;font-weight:500}
.ev-item .sm{color:var(--ink2)}

/* disclaimer */
.disc{font-size:11.5px;color:var(--ink3);line-height:1.7;padding:8px 10px;background:var(--line2);border-radius:6px}

/* graph card */
.graph-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.graph-card .gtitle{font-family:'Noto Serif SC',serif;font-weight:600;font-size:14px;margin-bottom:8px}
#net{height:360px;border:1px solid var(--line2);background:var(--paper);border-radius:6px}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--ink3);margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* Q&A */
.qa{margin:0 32px 20px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.qa-h{padding:10px 16px;border-bottom:1px solid var(--line);font-family:'Noto Serif SC',serif;font-weight:600;font-size:14px;display:flex;align-items:baseline;gap:8px}
.qa-h .hint{font-weight:400;font-size:11px;color:var(--ink3)}
.qa-b{padding:12px 16px}
.qa-row{display:flex;gap:8px;margin-bottom:8px}
.qa-row input{flex:1;padding:7px 11px;font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-family:'Noto Sans SC',sans-serif}
.qa-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qa-row button{padding:7px 16px;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:6px}
.qa-row button:hover{background:#0c5d56}
.qa-out{font-size:13px;white-space:pre-wrap;background:var(--paper);padding:10px 12px;border-radius:6px;min-height:36px;border:1px solid var(--line2);font-family:'Noto Sans SC',sans-serif;line-height:1.6}
.qa-out .tg{font-size:11px;color:var(--ink3);margin-bottom:5px;font-family:'JetBrains Mono',monospace}
.err{color:var(--accent);font-size:12px}

@media(max-width:780px){
  .main{grid-template-columns:1fr}
  .col-l{border-right:none;border-bottom:1px solid var(--line)}
  .col-r{position:static}
  .doc-head,.ctl,.col,.qa{padding-left:16px;padding-right:16px}
  .cls{flex-direction:column;gap:6px}
}
</style>
</head>
<body>

<div class="doc-head">
  <div class="row1">
    <span class="code" id="tcode">------</span>
    <h1 id="tname">关联方穿透底稿</h1>
    <span class="meta">判定 LLM=0<br>非投资建议</span>
  </div>
  <div class="sub">RPScope · A 股关联方穿透与风险底稿系统</div>
</div>

<div class="ctl">
  <input id="code" type="text" value="002594" style="width:88px">
  <button onclick="load()">生成底稿</button>
  <button class="ghost" onclick="load('002594')">比亚迪</button>
  <button class="ghost" onclick="load('300750')">宁德时代</button>
  <button class="ghost" onclick="load('600519')">茅台</button>
  <button class="ghost" onclick="load('000858')">五粮液</button>
  <button class="ghost" onclick="load('601318')">中国平安</button>
  <button class="ghost" onclick="load('600036')">招商银行</button>
  <button class="ghost" onclick="load('300059')">东方财富</button>
  <button class="ghost" onclick="load('601012')">隆基绿能</button>
  <button class="ghost" onclick="load('000001')">平安银行</button>
  <button class="ghost" onclick="load('600276')">恒瑞医药</button>
  <button class="ghost" onclick="load('002475')">立讯精密</button>
  <button class="ghost" onclick="randomCo()" style="color:var(--accent)">随机一家</button>
  <span class="stat" id="stat"></span>
</div>

<div class="main">
  <div class="col col-l" id="report"><p class="empty">输入股票代码，点生成底稿。</p></div>
  <div class="col col-r">
    <div class="graph-card">
      <div class="gtitle">股权与关联路径</div>
      <p style="font-size:11px;color:var(--ink2);margin-bottom:8px;line-height:1.6">橙色方块=被分析公司。箭头方向: 关联方 →(指向)→ 被分析公司。<b>实控人</b>(teal)控制公司; <b>股东</b>(灰)持股公司; <b>关联方候选</b>(绿=高/橙=中/灰=低置信)由规则引擎发现。蓝=年报金标准验证。</p>
      <div id="net"></div>
      <div class="legend">
        <span><i style="background:#e08a2b"></i>主体公司</span>
        <span><i style="background:#0f766e"></i>实控人(控制)</span>
        <span><i style="background:#888"></i>股东(持股)</span>
        <span><i style="background:var(--high)"></i>关联·高置信</span>
        <span><i style="background:var(--med)"></i>中置信</span>
        <span><i style="background:var(--matched)"></i>金标准验证</span>
      </div>
    </div>
  </div>
</div>

<div class="qa">
  <div class="qa-h">问答<span class="hint">意图路由 / 简单题不调 LLM / 回查防幻觉</span></div>
  <div class="qa-b">
    <div class="qa-row">
      <input id="q" type="text" value="002594的前十大股东和实控人" placeholder="002594的关联方 / 002594和300750什么关系 / 002594风险事件">
      <button onclick="ask()">问</button>
    </div>
    <div class="qa-out" id="ans"><span class="dim">点问看答案。</span></div>
  </div>
</div>

<script>
function dv(v,d='—'){return(v===null||v===undefined||v===''||v==='None')?d:v}
async function load(force){
  const code=(force||document.getElementById('code').value).trim();
  document.getElementById('code').value=code;
  document.getElementById('tcode').textContent=code;
  document.getElementById('tname').textContent='加载中';
  document.getElementById('stat').textContent='';
  document.getElementById('report').innerHTML='<p class=empty>加载中</p>';
  let r;
  try{r=await fetch('/api/report/'+code).then(async x=>x.ok?x.json():Promise.reject(await x.text()))}
  catch(e){document.getElementById('report').innerHTML='<p class=err>'+String(e).slice(0,180)+'</p>';return}
  if(!r||r.error){document.getElementById('report').innerHTML='<p class=err>'+(r&&r.error||'无数据')+'</p>';return}
  const co=r.basic||{};
  document.getElementById('tname').textContent=(co.short_name||'')+' 关联方穿透底稿';
  const rr=r.related||{};
  document.getElementById('stat').innerHTML=`已披露 <b>${rr.n_matched}</b> / 系统发现 <b>${rr.n_system_only}</b> / 年报未验证 <b>${rr.n_gold_only}</b> / 事件 ${r.events.length}`;
  renderReport(code,r);drawNet(code,r);
}
function renderReport(code,r){
  const co=r.basic||{};
  let h='';
  h+='<div class=sec><div class=sec-h>基本信息<span class=badge>'+code+'</span></div><table>'+
     `<tr><td class=dim style=width:50px>简称</td><td>${co.short_name||dv(co.short_name)}</td><td class=dim style=width:50px>代码</td><td class=mono>${code}</td></tr>`+
     `<tr><td class=dim>行业</td><td>${co.industry||'未知'}</td><td class=dim>上市</td><td class=mono>${dv(co.list_date)}</td></tr></table></div>`;
  const hasRatio=(r.holders||[]).some(x=>x.ratio!=null);
  h+='<div class=sec><div class=sec-h>股权结构 前十大股东</div><table><thead><tr><th class=r style=width:30px>#</th><th>股东</th>'+(hasRatio?'<th class=r>比例</th>':'')+'<th>类型</th></tr></thead><tbody>';
  (r.holders||[]).filter(x=>!x.is_channel).forEach((x,i)=>{h+=`<tr><td class=r>${i+1}</td><td>${x.display_name}</td>${hasRatio?`<td class=r>${x.ratio!=null?x.ratio+'%':'<span class=dim>未披露</span>'}</td>`:''}<td class="dim mono">${dv(x.entity_type)}</td></tr>`});
  if(!(r.holders||[]).length)h+='<tr><td colspan=4 class=empty>无</td></tr>';
  h+='</tbody></table>';
  const cs=r.controllers||[];
  h+=`<div style="margin-top:8px;font-size:13px;padding-top:6px;border-top:1px solid var(--line2)"><span class=dim>实际控制人</span> ${cs.length?'<b>'+cs.map(x=>x.display_name+'</b> ('+dv(x.control_ratio)+'%)').join(' ')+'</b>':'<span class=dim>未披露</span>'}</div></div>`;
  const rr=r.related||{};
  h+='<div class=sec><div class=sec-h>关联方清单</div>';
  h+=`<div class=cls><div class="c m"><span class=n>${rr.n_matched}</span><span class=lbl>已披露验证</span></div><div class="c s"><span class=n>${rr.n_system_only}</span><span class=lbl>系统发现待核查</span></div><div class="c g"><span class=n>${rr.n_gold_only}</span><span class=lbl>年报未验证</span></div></div>`;
  h+='<div class=rp-list">';
  (rr.system_only||[]).slice(0,18).forEach(s=>{
    const cf=s.confidence;
    h+=`<div class=rp-item onclick="this.querySelector('.ev-detail').classList.toggle('show')"><span class=nm>${s.name}</span><span class="tag ${cf}">${cf}</span><span class=rl>${s.rule}</span>${s.path?`<div class=pth>${s.path.slice(0,120)}${s.path.length>120?'…':''}</div>`:''}<div class="ev-detail">证据: ${(s.evidence||[]).map(e=>(e.source||e.table||'?')).join(' / ')||'无'}</div></div>`;
  });
  h+='</div>';
  h+=`<div class=rp-inline"><span class=dim>已披露验证:</span> ${(rr.matched||[]).map(x=>x.name).join(', ')||'<span class=dim>无</span>'}</div>`;
  h+=`<div class=rp-inline"><span class=dim>年报未验证:</span> ${(rr.gold_only||[]).map(x=>x.name).join(', ')||'<span class=dim>无</span>'}</div></div>`;
  h+='<div class=sec><div class=sec-h>风险事件时间线</div><div class=ev-list">';
  (r.events||[]).slice(0,12).forEach(e=>{h+=`<div class=ev-item><span class=dt>${dv(e.event_date)}</span><span class=typ>${e.event_type}</span><span class=sm>${(e.summary||'').slice(0,50)}</span></div>`});
  if(!(r.events||[]).length)h+='<span class=empty>无</span>';
  h+='</div></div>';
  h+=`<div class=sec><div class=sec-h>口径与限制</div><div class=disc>${r.disclaimer.disclaimer}<br><br><span class=dim>数据来源: ${r.disclaimer.data_sources}<br>覆盖: ${r.disclaimer.coverage}</span></div></div>`;
  document.getElementById('report').innerHTML=h;
}
function drawNet(code,r){
  const F={color:'#fff',face:'Noto Sans SC',size:13,bold:true};
  const nodes=[],edges=[];let i=0;
  nodes.push({id:code,label:code,color:'#e08a2b',font:{...F,size:15}});
  (r.controllers||[]).forEach(c=>{const id='c'+i++;nodes.push({id,label:c.display_name,color:'#0f766e',font:F});edges.push({from:id,to:code,label:'控制 '+(c.control_ratio||'')+'%',arrows:'to',color:'#0f766e',font:{size:10,color:'#0f766e'}})});
  (r.holders||[]).slice(0,10).forEach(x=>{
    if((r.controllers||[]).some(c=>c.display_name===x.display_name))return;
    const id='h'+i++;
    const isCh=x.is_channel;
    nodes.push({id,label:x.display_name,color:isCh?'#cbd5e1':'#6b7280',font:{...F,size:11},borderWidth:isCh?1:2});
    edges.push({from:id,to:code,label:x.ratio!=null?(isCh?'通道 ':'持股 ')+x.ratio+'%':(isCh?'通道':'持股'),arrows:'to',color:isCh?'#e2e8f0':'#9ca3af',dashes:isCh,font:{size:10,color:isCh?'#94a3b8':'#6b7280'}})});
  // gold_only(年报披露但系统未验证)
  (r.related.gold_only||[]).slice(0,8).forEach(s=>{
    const id='g'+i++;
    if(nodes.some(n=>n.label===s.name))return;
    nodes.push({id,label:s.name,color:'#dbeafe',font:{color:'#1e40af',face:'Noto Sans SC',size:12,bold:true},borderWidth:2});
    edges.push({from:id,to:code,label:'年报',arrows:'to',color:'#93c5fd',font:{size:10,color:'#3b82f6'}})});
  // 事件
  (r.events||[]).slice(0,5).forEach(e=>{
    const id='e'+i++;
    nodes.push({id,label:e.event_type,color:'#fef3c7',font:{color:'#92400e',face:'Noto Sans SC',size:11},borderWidth:1});
    edges.push({from:id,to:code,label:e.event_type,arrows:'to',color:'#fbbf24',dashes:true,font:{size:9,color:'#b45309'}})});
  (r.related.system_only||[]).slice(0,12).forEach(s=>{const id='p'+i++;const col=s.confidence==='high'?'#15803d':(s.confidence==='medium'?'#b45309':'#6b7280');nodes.push({id,label:s.name,color:col,font:{...F,size:11}});edges.push({from:code,to:id,label:s.rule,arrows:'to',dashes:s.confidence==='low',color:'#9ca3af',font:{size:10,color:'#6b7280'}})});
  (r.related.matched||[]).forEach(s=>{const id='m'+i++;nodes.push({id,label:s.name,color:'#1e40af',font:{...F,size:11}});edges.push({from:code,to:id,label:'验证',arrows:'to',color:'#1e40af',font:{size:10,color:'#1e40af'}})});
  new vis.Network(document.getElementById('net'),{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},{layout:{improvedLayout:true},physics:{stabilization:true,barnesHut:{springLength:160,springStrength:.04}},nodes:{shape:'box',margin:8,widthConstraint:{maximum:140},borderWidth:2},edges:{smooth:{type:'continuous'},width:1.5}});
}
async function randomCo(){
  try{const r=await fetch('/api/random').then(async x=>x.ok?x.json():Promise.reject(await x.text()));
    if(r&&r.stock_code){document.getElementById('code').value=r.stock_code;load(r.stock_code)}
  }catch(e){}
}
async function ask(){
  const q=document.getElementById('q').value.trim();if(!q)return;
  const out=document.getElementById('ans');out.innerHTML='<span class=dim>思考中</span>';
  let r;
  try{r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})}).then(async x=>x.ok?x.json():Promise.reject(await x.text()))}
  catch(e){out.innerHTML='<span class=err>'+String(e).slice(0,250)+'</span>';return}
  const v=r.verify||{};
  out.innerHTML='<div class=tg>'+r.intent+' / LLM '+(r.used_llm?'用':'未用')+' / 回查 '+(v.passed?'通过':'未通过')+(r.elapsed_ms!=null?' / '+Math.round(r.elapsed_ms)+'ms':'')+(r.cache_hit?' / 缓存':'')+'</div>'+r.answer;
}
</script>
</body>
</html>
