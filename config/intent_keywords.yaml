# 意图分类关键词配置 — T2
# 每类意图的判别关键词与句式模式

Q1_related_party:
  keywords:
    - 关联方
    - 关联关系
    - 关联交易
    - 关联人
  patterns:
    - ".*的关联方.*"
    - ".*关联方有.*"
    - ".*关联方清单.*"

Q2_relation_path:
  keywords:
    - 什么关系
    - 关系
    - 有关联
    - 关联吗
  patterns:
    - ".*和.*什么关系.*"
    - ".*与.*什么关系.*"
    - ".*和.*关联.*"
    - ".*与.*关联.*"

Q3_reverse_control:
  keywords:
    - 控制哪些
    - 持有哪些
    - 在哪些公司
    - 任职
    - 担任
    - 控制
  patterns:
    - ".*控制.*公司.*"
    - ".*持有.*上市.*"
    - ".*在.*公司.*任职.*"
    - ".*担任.*"

Q4_company_role:
  keywords:
    - 前十大股东
    - 十大股东
    - 股东
    - 高管
    - 董监高
    - 董事
    - 监事
    - 总经理
    - 实控人
    - 实际控制人
    - 基本信息
  patterns:
    - ".*的股东.*"
    - ".*的实控人.*"
    - ".*的董监高.*"
    - ".*实际控制人.*"

Q5_risk_events:
  keywords:
    - 担保
    - 诉讼
    - 质押
    - 风险事件
    - 风险
    - 法律纠纷
  patterns:
    - ".*的担保.*"
    - ".*的诉讼.*"
    - ".*的质押.*"
    - ".*风险事件.*"

Q6_overlap:
  keywords:
    - 关联方重合
    - 关联方交集
    - 共同关联方
    - 关联方重叠
  patterns:
    - ".*和.*关联方重合.*"
    - ".*和.*共同关联方.*"
    - ".*和.*关联方交集.*"
    - ".*和.*关联方重叠.*"

# Q7 (open) = fallback, no keywords
