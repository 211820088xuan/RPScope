# 指代消解关键词配置

pronouns:
  - 它
  - 它的
  - 该公司
  - 该股
  - 这家
  - 这家公司
  - 这个
  - 这只
  - 该
  - 其

ordinals:
  第一: 0
  第二个: 1
  第二: 1
  第三个: 2
  第三: 2
  第四个: 3
  第四: 3
  第五个: 4
  第五: 4
  最后那个: -1
  最后一个: -1
  最后: -1
  前面那个: 0
  前面那个公司: 0

omission_indicators:
  # 这些词出现且问句无实体时, 触发省略主语指代
  - 关联方
  - 担保
  - 诉讼
  - 质押
  - 股东
  - 实控人
  - 董监高
  - 风险事件

override_indicators:
  # 这些词出现时, 是显式覆盖(新实体, 替换焦点)
  - 那茅台
  - 那宁德
  - 那比亚迪
  - 换一家
  - 改成
