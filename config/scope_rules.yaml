# 金标准能力范围分类规则 - 基于 relation_desc + party_name 关键词匹配
# 分类: upstream(系统能力内) / downstream(能力外) / other(无法判定)
# 不用 LLM, 纯规则, 可审计

# 匹配优先级: relation_desc 先匹配, 不中则 party_name 兜底
# 每条规则是正则(re.search), 不区分大小写

upstream:
  desc_keywords:  # 在 relation_desc 里匹配
    - 控股股东
    - 母公司
    - 实际控制人
    - 实控人
    - 最终控制
    - 持有5%
    - 5%以上
    - 第一大股东
    - 董事
    - 监事
    - 高级管理
    - 高管
    - 同一控制
    - 同受.*控制
    - 受.*控制
    - 兄弟
    - 担保方
    - 被担保方
    - 股东之子公司  # 股东的子公司, 经上游可达
    - 股东单位
    - 董事长
    - 总经理
    - 控制方
    - 关键管理
    - 近亲属
    - 主要投资者
  name_keywords:  # relation_desc 空时, 在 party_name 里匹配
    # 人名特征: 短名(2-4字)且无公司后缀 → 可能是董事/股东
    # 这里用显式关键词, 不做长度推断(太不可靠)

downstream:
  desc_keywords:
    - 子公司
    - 控股子公司
    - 全资子公司
    - 全资孙公司
    - 孙公司
    - 联营企业
    - 联营
    - 合营企业
    - 合营
    - 参股公司
    - 参股企业
    - 参股
    - 分公司
    - 子企业
    - 少数股东  # 子公司之少数股东
    - 子公司之
  name_keywords:  # relation_desc 空时, party_name 含这些 → downstream
    - 子公司
    - 孙公司
    - 联营
    - 合营
    - 参股
    - 分公司
